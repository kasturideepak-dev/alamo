<section class="section" id="testimonials">
  <div class="shell">
    <div class="center" style="margin-bottom:clamp(34px,4vw,58px)">
      <p class="eyebrow" data-reveal-y>Patient Testimonial</p>
      <h2 class="h2" data-split>What Our Patient Say</h2>
    </div>

    <div class="tst" data-carousel>
      <button class="tst__nav" type="button" data-car-prev aria-label="Previous testimonial">
        <svg aria-hidden="true"><use href="#i-arrow-l"/></svg>
      </button>

      <div class="tst__stage" data-reveal-y>
        <figure class="tst__card" data-slide>
          <div class="tst__avatar"><img src="assets/img/avatar-1.jpg" alt="" loading="lazy"></div>
          <blockquote>
            <p class="tst__quote">The staff is amazing and always makes me feel comfortable. The doctors truly care!
              Professional, kind, and thorough. I highly recommend Alamo Primary Care.</p>
            <span class="tst__rule"></span>
            <figcaption class="tst__who"><b>Jessica R.</b><span>Patient</span></figcaption>
          </blockquote>
        </figure>
        <figure class="tst__card" data-slide hidden>
          <div class="tst__avatar"><img src="assets/img/avatar-2.jpg" alt="" loading="lazy"></div>
          <blockquote>
            <p class="tst__quote">Booking was simple and I was seen on time. Dr. Nemarugommula explained every
              result clearly and never once made me feel rushed.</p>
            <span class="tst__rule"></span>
            <figcaption class="tst__who"><b>Patient Name</b><span>Patient</span></figcaption>
          </blockquote>
        </figure>
        <figure class="tst__card" data-slide hidden>
          <div class="tst__avatar"><img src="assets/img/avatar-3.jpg" alt="" loading="lazy"></div>
          <blockquote>
            <p class="tst__quote">I have been coming here for two years for chronic care. The follow-up is
              consistent and the whole team knows my history.</p>
            <span class="tst__rule"></span>
            <figcaption class="tst__who"><b>Patient Name</b><span>Patient</span></figcaption>
          </blockquote>
        </figure>
      </div>

      <button class="tst__nav" type="button" data-car-next aria-label="Next testimonial">
        <svg aria-hidden="true"><use href="#i-arrow-r"/></svg>
      </button>
    </div>

    <div class="tst__dots" role="tablist" aria-label="Choose testimonial">
      <button class="tst__dot is-on" type="button" data-car-dot role="tab" aria-label="Testimonial 1" aria-selected="true"></button>
      <button class="tst__dot" type="button" data-car-dot role="tab" aria-label="Testimonial 2" aria-selected="false"></button>
      <button class="tst__dot" type="button" data-car-dot role="tab" aria-label="Testimonial 3" aria-selected="false"></button>
    </div>
  </div>
</section>
